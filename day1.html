<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grow Frontend Navbar</title>

    <style>
        img{
            height: 60px;
            width: 100px;
            margin-left: 45px;

        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fbfdfc;
        }

        /* Navbar */
        .navbar {
            width: 100%;
            height: 70px;
            background: #02e215;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        /* Logo */
        .logo {
            color: #22c55e;
            font-size: 28px;
            font-weight: bold;
            text-decoration: none;
        }

        /* Menu */
        .nav-links {
            display: flex;
            list-style: none;
            gap: 40px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #22c55e;
        }

        /* Button */
        .btn {
            background: #22c55e;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #16a34a;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .navbar {
                padding: 0 5%;
            }

            .nav-links {
                display: none;
            }

            .btn {
                padding: 8px 14px;
            }
        .is{
            width: 50%;
        }
        }
        .is img{
            height: auto;
            width: 550px;
            display: block;
            margin-left: auto;

        }
        
    </style>
</head>

<body>

    <nav class="navbar">

        <img src="download (1).png" alt="">

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

        <a href="#" class="btn">Get Started</a>

    </nav>
    <div class="hero">
        

    </div>
   <div class="is">
    <img src="stocks-explore.svg" alt="">

   </div>

</body>
</html>
